# Example configuration for training on the NYUv2 dataset

# Root directory containing:
# - train_list.txt, val_list.txt
# - rgb/, depth/, seg/ subfolders with matching filenames

# Path to the NYUv2 dataset root
data_root: "/nas-ctm01/datasets/public/NYUv2"
#data_root: "/home/francisco.m.ribeiro/PDEEC/VC/Assignment 2/rgbd-align/data/raw/NYUv2"
# Python module containing your model definition (e.g. unet_rgbd.py)
model_module: "models.vfms.dinov2_cross_modal_adapter"
# Class name of the model to instantiate
model_class: "DINOv2SegmentationModel"

depth_rep: "hha"
loss: "CrossEntropyLoss"
# Encoder backbone and weight options
backbone: "dinov2_vitl14"
pretrained: true          # whether to load pretrained ImageNet weights

# Training parameters
num_classes: 14           # number of segmentation output channels
batch_size: 4
gradient_accumulation_steps: 4
epochs: 40
num_workers: 8
augmentation: True 

optimizer:
  name: AdamW
  weight_decay: 0.05
  param_groups:
    - module: rgb_encoder
      lr: 1e-5
    - module: depth_encoder
      lr: 1e-3
    - module: decoder
      lr: 1e-3
    - module: adapter
      lr: 1e-3

lr_scheduler: 
  name: poly
  power: 0.9
  max_iters: 3600

# Directory where checkpoints will be saved
out_dir: "./checkpoints"

freeze_schedule:
  # Phase 1: Epochs 1–10 → train only depth encoder + adapter
  - epoch: 1
    freeze_rgb:     true
    freeze_depth:   false
    freeze_decoder: true
    freeze_adapter: false

  # Phase 2: Epochs 11–25 → add decoder into training
  - epoch: 11
    freeze_rgb:     true
    freeze_depth:   false
    freeze_decoder: false
    freeze_adapter: false

  # Phase 3: Epochs 26–40 → full fine-tuning
  - epoch: 26
    freeze_rgb:     false
    freeze_depth:   false
    freeze_decoder: false
    freeze_adapter: false
